<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Praćenje faktura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8ECE6; --surface:#F7F9F5; --ink:#1A2530; --muted:#5E6B73; --line:#CBD3CC;
  --debt:#B5452A; --debt-soft:#F3DED6; --paid:#2E6A4B; --paid-soft:#D8E8DD; --btn-ink:#F7F9F5;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131A1F; --surface:#1B242B; --ink:#E6ECE8; --muted:#93A1A8; --line:#2C3740;
    --debt:#E58A6C; --debt-soft:#3A2520; --paid:#79C79C; --paid-soft:#1E3328; --btn-ink:#131A1F;
  }
}
:root[data-theme="dark"]{
  --paper:#131A1F; --surface:#1B242B; --ink:#E6ECE8; --muted:#93A1A8; --line:#2C3740;
  --debt:#E58A6C; --debt-soft:#3A2520; --paid:#79C79C; --paid-soft:#1E3328; --btn-ink:#131A1F;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:560px;margin:0 auto;padding:16px 18px 40px}

/* Home */
.home{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;gap:28px}
.home p{margin:0;color:var(--muted)}
.brand{display:block;width:100%;text-align:left;background:var(--ink);color:var(--btn-ink);border:0;border-radius:28px;padding:34px 28px 26px;transition:transform .15s}
.brand:active{transform:scale(.985)}
.brand .word{font-family:var(--serif);font-size:clamp(56px,17vw,88px);line-height:.9;letter-spacing:-.01em;display:block}
.brand .meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px;font-size:15px;opacity:.85}
.brand .meta strong{font-size:20px;font-weight:600;opacity:1}

/* Top bar */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.bar h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px}

/* Supplier list */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sup{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.sup .name{font-weight:600;font-size:17px}
.sup .sub{color:var(--muted);font-size:14px}
.sup .right{margin-left:auto;text-align:right}
.sup .owed{font-weight:600;color:var(--debt)}
.sup .clear{color:var(--paid);font-size:14px}

.primary{width:100%;border:0;border-radius:14px;background:var(--ink);color:var(--btn-ink);padding:15px;font-weight:600;margin-top:14px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:14px;padding:13px 16px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}

/* Supplier screen */
.summary{display:flex;gap:10px;margin-bottom:16px}
.summary div{flex:1;border-radius:16px;padding:14px 16px}
.summary .d{background:var(--debt-soft)}
.summary .p{background:var(--paid-soft)}
.summary small{display:block;font-size:13px;color:var(--muted)}
.summary b{font-size:22px;font-weight:600}
.summary .d b{color:var(--debt)} .summary .p b{color:var(--paid)}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:11px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--btn-ink)}

.inv{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 12px;display:flex;gap:12px;align-items:flex-start}
.inv.overdue{border-color:var(--debt)}
.check{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;margin-top:2px}
.check:hover{border-color:var(--paid)}
.check.on{background:var(--paid);border-color:var(--paid);color:var(--btn-ink)}
.inv .body{flex:1;min-width:0}
.inv .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.inv .no{font-weight:600}
.inv .amt{font-weight:600}
.dates{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:6px;font-size:14px;color:var(--muted)}
.dates span:nth-child(even){color:var(--ink)}
.flag{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px}
.flag.late{background:var(--debt-soft);color:var(--debt)}
.flag.soon{background:var(--paper);color:var(--ink)}
.more{flex:none;border:0;background:transparent;color:var(--muted);padding:2px 4px;font-size:20px;line-height:1}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 14px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;font-size:16px}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;margin:4px 0 12px;font-size:15px}
.toggle input{width:20px;height:20px;accent-color:var(--ink)}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .primary{margin:0;flex:1}
.danger{color:var(--debt)}
.menu button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:15px 4px;font-size:16px}
.menu button:last-child{border-bottom:0}
.err{color:var(--debt);font-size:14px;margin:0 0 10px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--btn-ink);padding:11px 18px;border-radius:999px;font-size:14px;z-index:20;display:flex;gap:14px;align-items:center}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Učitavanje…</div></div>
<div id="overlay"></div>
<div id="toastHost"></div>

<script>
(function(){
  // ---------- helpers ----------
  const $ = (s, r=document) => r.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
  const addDays = (iso, n) => { const [y,m,d]=iso.split("-").map(Number); const dt=new Date(y,m-1,d+Number(n)); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); };
  const fmtDate = iso => { if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}.${m}.${y}.`; };
  const daysUntil = iso => { const [y,m,d]=iso.split("-").map(Number); const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(y,m-1,d)-t)/864e5); };
  const money = n => (Number(n)||0).toLocaleString("bs-BA",{minimumFractionDigits:2,maximumFractionDigits:2}) + " KM";
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);

  // ---------- state ----------
  const S = { ready:false, suppliers:[], invoices:[], view:"home", supplierId:null, tab:"debt" };
  let db = null;

  // ---------- storage layer (shared db, falls back to this browser) ----------
  const LS_KEY = "intermezo-fakture-v1";
  function loadLocal(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const d=JSON.parse(raw); S.suppliers=d.suppliers||[]; S.invoices=d.invoices||[]; } }catch(e){} }
  function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({suppliers:S.suppliers,invoices:S.invoices})); }catch(e){} }

  async function withRetry(fn){
    try { return await fn(); }
    catch(e){
      if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); return fn(); }
      throw e;
    }
  }
  function reportWriteError(e){
    if(e && e.code==="quota_exceeded") toast("Baza je puna. Obriši stare fakture pa pokušaj ponovo.");
    else if(e && e.code==="invalid_argument") toast("Nemaš dozvolu za izmjene na ovoj stranici.");
    else toast("Spremanje nije uspjelo. Pokušaj ponovo.");
  }

  const api = {
    async put(coll, id, data){
      if(db){ try{ await withRetry(()=>db.collection(coll).doc(id).set(data)); }catch(e){ reportWriteError(e); } return; }
      const arr = coll==="suppliers"?S.suppliers:S.invoices;
      const i = arr.findIndex(x=>x.id===id);
      const row = {...data, id};
      if(i>=0) arr[i]=row; else arr.push(row);
      saveLocal(); render();
    },
    async remove(coll, id){
      if(db){ try{ await withRetry(()=>db.collection(coll).doc(id).delete()); }catch(e){ reportWriteError(e); } return; }
      if(coll==="suppliers") S.suppliers=S.suppliers.filter(x=>x.id!==id);
      else S.invoices=S.invoices.filter(x=>x.id!==id);
      saveLocal(); render();
    }
  };
  const strip = o => { const {id, ...rest} = o; return rest; };

  async function init(){
    let got = null;
    try { got = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e){ got = null; }
    if(got){
      db = got;
      let seenS=false, seenI=false;
      const done = () => { if(seenS && seenI && !S.ready){ S.ready=true; } render(); };
      const onErr = () => { toast("Veza s bazom je prekinuta. Osvježi stranicu."); };
      db.collection("suppliers").onSnapshot(snap=>{
        S.suppliers = snap.docs.map(d=>({id:d.id, ...d.data()})); seenS=true; done();
      }, onErr);
      db.collection("invoices").onSnapshot(snap=>{
        S.invoices = snap.docs.map(d=>({id:d.id, ...d.data()})); seenI=true; done();
      }, onErr);
    } else {
      loadLocal(); S.ready=true; render();
    }
  }

  // ---------- derived ----------
  const invFor = sid => S.invoices.filter(i=>i.supplierId===sid);
  const openOf = list => list.filter(i=>!i.paid);
  const sum = list => list.reduce((a,i)=>a+(Number(i.amount)||0),0);
  const sortedSuppliers = () => [...S.suppliers].sort((a,b)=>a.name.localeCompare(b.name,"bs"));
  const currentSupplier = () => S.suppliers.find(s=>s.id===S.supplierId);

  // ---------- render ----------
  function go(view, extra={}){ Object.assign(S,{view},extra); render(); window.scrollTo(0,0); }

  function render(){
    const app = $("#app");
    if(!S.ready){ app.innerHTML = `<div class="loading">Učitavanje…</div>`; return; }
    if(S.view==="supplier" && !currentSupplier()) S.view="suppliers";
    if(S.view==="home") app.innerHTML = homeHTML();
    else if(S.view==="suppliers") app.innerHTML = suppliersHTML();
    else app.innerHTML = supplierHTML();
  }

  const backBtn = `<button class="back" data-act="back" aria-label="Nazad"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>`;

  function homeHTML(){
    const open = openOf(S.invoices);
    const late = open.filter(i=>i.dueDate && daysUntil(i.dueDate)<0).length;
    return `<section class="home">
      <button class="brand" data-act="open-suppliers">
        <span class="word">Intermezo</span>
        <span class="meta num"><span>${S.suppliers.length} ${S.suppliers.length===1?"dobavljač":"dobavljača"}</span><strong>${money(sum(open))}</strong></span>
      </button>
      <p>${open.length ? `Otvoreno ${open.length} ${open.length===1?"faktura":"faktura"}${late?`, od toga ${late} ${late===1?"kasni":"kasne"} s plaćanjem`:""}.` : "Nema otvorenih dugovanja."} Dodirni za pregled dobavljača.</p>
    </section>`;
  }

  function suppliersHTML(){
    const list = sortedSuppliers();
    const items = list.map(s=>{
      const open = openOf(invFor(s.id));
      const late = open.filter(i=>i.dueDate && daysUntil(i.dueDate)<0).length;
      const rule = s.autoDays!=null && s.autoDays!=="" ? `Rok ${s.autoDays} dana, automatski` : "Rok se unosi ručno";
      return `<li><button class="sup" data-act="open-supplier" data-id="${esc(s.id)}">
        <div><div class="name">${esc(s.name)}</div><div class="sub">${rule}</div></div>
        <div class="right num">${open.length
          ? `<div class="owed">${money(sum(open))}</div><div class="sub">${open.length} otvoreno${late?`, ${late} kasni`:""}</div>`
          : `<div class="clear">Sve plaćeno</div>`}</div>
      </button></li>`;
    }).join("");
    return `<div class="bar">${backBtn}<h1>Dobavljači</h1></div>
      ${list.length ? `<ul class="list">${items}</ul>` : `<div class="empty">Još nema dobavljača. Dodaj prvog da počneš unositi fakture.</div>`}
      <button class="primary" data-act="new-supplier">Dodaj dobavljača</button>`;
  }

  function supplierHTML(){
    const s = currentSupplier();
    const all = invFor(s.id);
    const open = openOf(all).sort((a,b)=>(a.dueDate||"9").localeCompare(b.dueDate||"9"));
    const paid = all.filter(i=>i.paid).sort((a,b)=>(b.paidDate||"").localeCompare(a.paidDate||""));
    const debtTab = S.tab==="debt";
    const rows = (debtTab?open:paid).map(i=>invoiceHTML(i)).join("");
    const emptyMsg = debtTab ? "Nema dugovanja prema ovom dobavljaču." : "Još nema plaćenih faktura. Kad označiš fakturu kao plaćenu, pojavit će se ovdje.";
    return `<div class="bar">${backBtn}<h1>${esc(s.name)}</h1><button class="icon-btn" data-act="edit-supplier">Uredi</button></div>
      <div class="summary num">
        <div class="d"><small>Dugovanja</small><b>${money(sum(open))}</b></div>
        <div class="p"><small>Plaćeno</small><b>${money(sum(paid))}</b></div>
      </div>
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="${debtTab}" data-act="tab" data-tab="debt">Dugovanja (${open.length})</button>
        <button role="tab" aria-selected="${!debtTab}" data-act="tab" data-tab="paid">Plaćeno (${paid.length})</button>
      </div>
      ${rows ? `<ul class="list">${rows}</ul>` : `<div class="empty">${emptyMsg}</div>`}
      ${debtTab ? `<button class="primary" data-act="new-invoice">Dodaj fakturu</button>` : ""}`;
  }

  function invoiceHTML(i){
    let flag = "";
    if(!i.paid && i.dueDate){
      const d = daysUntil(i.dueDate);
      if(d<0) flag = `<span class="flag late">Kasni ${-d} ${-d===1?"dan":"dana"}</span>`;
      else if(d===0) flag = `<span class="flag late">Dospijeva danas</span>`;
      else if(d<=7) flag = `<span class="flag soon">Dospijeva za ${d} ${d===1?"dan":"dana"}</span>`;
    }
    const dates = i.paid
      ? `<span>Kreirana</span><span>${fmtDate(i.issueDate)}</span><span>Plaćena</span><span>${fmtDate(i.paidDate)}</span>`
      : `<span>Unesena</span><span>${fmtDate(i.issueDate)}</span><span>Rok plaćanja</span><span>${fmtDate(i.dueDate)}</span>`;
    const late = !i.paid && i.dueDate && daysUntil(i.dueDate)<0;
    return `<li class="inv${late?" overdue":""}">
      <button class="check${i.paid?" on":""}" data-act="${i.paid?"unpay":"pay"}" data-id="${esc(i.id)}" aria-label="${i.paid?"Vrati u dugovanja":"Označi kao plaćeno"}">${i.paid?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>`:""}</button>
      <div class="body">
        <div class="top"><span class="no">${esc(i.number||"Bez broja")}</span><span class="amt num">${i.amount!==""&&i.amount!=null?money(i.amount):""}</span></div>
        <div class="dates num">${dates}</div>
        ${flag}
      </div>
      <button class="more" data-act="inv-menu" data-id="${esc(i.id)}" aria-label="Opcije fakture">⋯</button>
    </li>`;
  }

  // ---------- sheets ----------
  function openSheet(html){
    $("#overlay").innerHTML = `<div class="scrim" data-act="close-scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    const first = $("#overlay input, #overlay select, #overlay button");
    if(first) first.focus();
  }
  function closeSheet(){ $("#overlay").innerHTML=""; }

  function supplierSheet(s){
    const auto = s ? (s.autoDays!=null && s.autoDays!=="") : false;
    openSheet(`<h2>${s?"Uredi dobavljača":"Novi dobavljač"}</h2>
      <form id="supForm" novalidate>
        <p class="err" id="err" hidden></p>
        <label class="field"><span>Naziv dobavljača</span><input name="name" value="${esc(s?.name||"")}" autocomplete="off"></label>
        <label class="toggle"><input type="checkbox" name="auto" ${auto?"checked":""}> Rok plaćanja se računa automatski</label>
        <label class="field" id="daysField" ${auto?"":"hidden"}><span>Broj dana do roka plaćanja</span><input name="days" type="number" inputmode="numeric" min="0" value="${esc(auto?s.autoDays:30)}"></label>
        <p class="hint">${"Ako je uključeno, rok se sam popuni kad uneseš fakturu. Inače ga unosiš ručno."}</p>
        <div class="actions">
          ${s?`<button type="button" class="ghost danger" data-act="del-supplier">Obriši</button>`:`<button type="button" class="ghost" data-act="close">Odustani</button>`}
          <button class="primary" type="submit">${s?"Spremi izmjene":"Dodaj dobavljača"}</button>
        </div>
      </form>`);
    const f = $("#supForm");
    f.auto.addEventListener("change",()=>{ $("#daysField").hidden=!f.auto.checked; });
    f.addEventListener("submit", async ev=>{
      ev.preventDefault();
      const name=f.name.value.trim();
      if(!name){ showErr("Upiši naziv dobavljača."); return; }
      let autoDays=null;
      if(f.auto.checked){ const n=parseInt(f.days.value,10); if(isNaN(n)||n<0){ showErr("Broj dana mora biti 0 ili više."); return; } autoDays=n; }
      const id = s?.id || uid();
      closeSheet();
      await api.put("suppliers", id, {name, autoDays, createdAt: s?.createdAt || today()});
      if(!s) toast("Dobavljač dodan");
    });
  }

  function invoiceSheet(){
    const s = currentSupplier();
    const auto = s.autoDays!=null && s.autoDays!=="";
    const t = today();
    openSheet(`<h2>Nova faktura</h2>
      <form id="invForm" novalidate>
        <p class="err" id="err" hidden></p>
        <div class="row2">
          <label class="field"><span>Broj fakture</span><input name="number" autocomplete="off"></label>
          <label class="field"><span>Iznos (KM)</span><input name="amount" type="number" inputmode="decimal" step="0.01" min="0"></label>
        </div>
        <div class="row2">
          <label class="field"><span>Datum unosa</span><input name="issueDate" type="date" value="${t}"></label>
          <label class="field"><span>Rok plaćanja</span><input name="dueDate" type="date" value="${auto?addDays(t,s.autoDays):""}"></label>
        </div>
        <p class="hint">${auto?`Rok se računa automatski: ${s.autoDays} dana od datuma unosa. Možeš ga i promijeniti.`:"Za ovog dobavljača rok plaćanja unosiš ručno."}</p>
        <div class="actions">
          <button type="button" class="ghost" data-act="close">Odustani</button>
          <button class="primary" type="submit">Dodaj fakturu</button>
        </div>
      </form>`);
    const f = $("#invForm");
    let dueTouched=false;
    f.dueDate.addEventListener("input",()=>{ dueTouched=true; });
    f.issueDate.addEventListener("change",()=>{ if(auto && !dueTouched && f.issueDate.value) f.dueDate.value=addDays(f.issueDate.value,s.autoDays); });
    f.addEventListener("submit", async ev=>{
      ev.preventDefault();
      if(!f.issueDate.value){ showErr("Upiši datum unosa."); return; }
      if(!f.dueDate.value){ showErr("Upiši rok plaćanja."); return; }
      if(f.dueDate.value < f.issueDate.value){ showErr("Rok plaćanja ne može biti prije datuma unosa."); return; }
      const amt = f.amount.value==="" ? "" : Number(f.amount.value);
      closeSheet();
      await api.put("invoices", uid(), {
        supplierId:s.id, number:f.number.value.trim(), amount:amt,
        issueDate:f.issueDate.value, dueDate:f.dueDate.value, paid:false, paidDate:null
      });
      toast("Faktura dodana");
    });
  }

  function invoiceMenu(inv){
    openSheet(`<h2>${esc(inv.number||"Faktura")}</h2>
      <div class="menu">
        ${inv.paid
          ? `<button data-act="unpay" data-id="${esc(inv.id)}">Vrati u dugovanja</button>`
          : `<button data-act="pay" data-id="${esc(inv.id)}">Označi kao plaćeno</button>`}
        <button class="danger" data-act="del-invoice" data-id="${esc(inv.id)}">Obriši fakturu</button>
        <button data-act="close">Zatvori</button>
      </div>`);
  }

  function confirmSheet(title, text, label, onYes){
    openSheet(`<h2>${esc(title)}</h2><p style="margin:0 0 16px;color:var(--muted)">${esc(text)}</p>
      <div class="actions"><button class="ghost" data-act="close">Odustani</button><button class="primary" id="yes" style="background:var(--debt)">${esc(label)}</button></div>`);
    $("#yes").addEventListener("click", ()=>{ closeSheet(); onYes(); });
  }

  function showErr(m){ const e=$("#err"); e.textContent=m; e.hidden=false; }

  let toastTimer;
  function toast(msg, undo){
    clearTimeout(toastTimer);
    $("#toastHost").innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo?`<button id="undoBtn">Poništi</button>`:""}</div>`;
    if(undo) $("#undoBtn").addEventListener("click", ()=>{ $("#toastHost").innerHTML=""; undo(); });
    toastTimer = setTimeout(()=>{ $("#toastHost").innerHTML=""; }, undo?5000:2500);
  }

  // ---------- actions ----------
  async function setPaid(id, paid){
    const inv = S.invoices.find(i=>i.id===id); if(!inv) return;
    const before = {...inv};
    const next = {...strip(inv), paid, paidDate: paid ? today() : null};
    await api.put("invoices", id, next);
    toast(paid ? "Prebačeno u Plaćeno" : "Vraćeno u Dugovanja", ()=>api.put("invoices", id, strip(before)));
  }

  document.addEventListener("click", e=>{
    const el = e.target.closest("[data-act]"); if(!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if(act==="close-scrim"){ if(e.target===el) closeSheet(); return; }
    switch(act){
      case "open-suppliers": go("suppliers"); break;
      case "open-supplier": go("supplier",{supplierId:id, tab:"debt"}); break;
      case "back": go(S.view==="supplier"?"suppliers":"home"); break;
      case "tab": S.tab=el.dataset.tab; render(); break;
      case "new-supplier": supplierSheet(null); break;
      case "edit-supplier": supplierSheet(currentSupplier()); break;
      case "new-invoice": invoiceSheet(); break;
      case "inv-menu": { const inv=S.invoices.find(i=>i.id===id); if(inv) invoiceMenu(inv); break; }
      case "pay": closeSheet(); setPaid(id,true); break;
      case "unpay": closeSheet(); setPaid(id,false); break;
      case "close": closeSheet(); break;
      case "del-invoice": {
        const inv=S.invoices.find(i=>i.id===id);
        confirmSheet("Obrisati fakturu?", `Faktura ${inv?.number||""} bit će trajno obrisana.`, "Obriši", async ()=>{ await api.remove("invoices", id); toast("Faktura obrisana"); });
        break;
      }
      case "del-supplier": {
        const s=currentSupplier(); const n=invFor(s.id).length;
        confirmSheet("Obrisati dobavljača?", n?`Obrisat će se i ${n} ${n===1?"faktura":"faktura"} ovog dobavljača.`:"Dobavljač će biti trajno obrisan.", "Obriši", async ()=>{
          const ids=invFor(s.id).map(i=>i.id);
          go("suppliers");
          for(const iid of ids) await api.remove("invoices", iid);
          await api.remove("suppliers", s.id);
          toast("Dobavljač obrisan");
        });
        break;
      }
    }
  });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#overlay").innerHTML) closeSheet(); });

  render();
  init();
})();
</script>
</body>
</html>
